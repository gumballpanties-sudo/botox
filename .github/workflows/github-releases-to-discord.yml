name: Release → Discord

on:
  release:
    types: [published]

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord
        uses: SethCohen/github-releases-to-discord@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "8479739" # #8163FB = menu m_accent
          username: "botox updates"
          avatar_url: "https://i.imgur.com/KDUzwZf.png"
          content: "@everyone new botox update is out"
          footer_title: "botox • changelog"
          footer_icon_url: "https://i.imgur.com/KDUzwZf.png"
          footer_timestamp: true
          reduce_headings: true
          remove_github_reference_links: true
          max_description: "4000"
